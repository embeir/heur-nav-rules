[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nav-rules"
version = "0.1.0"
description = "Rule-based navigation command from detections; protocol-agnostic (map output to MAVLink or your system)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Emir Berbic" }
]
keywords = ["navigation", "computer-vision", "robotics", "uav", "mavlink"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]
gui = ["PySide6>=6.5"]

[project.scripts]
nav-rules-edit = "nav_rules.gui:main"

[project.urls]
Homepage = "https://github.com/embeir/heur-nav-rules"
Repository = "https://github.com/embeir/heur-nav-rules"
Issues = "https://github.com/embeir/heur-nav-rules/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nav_rules = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
